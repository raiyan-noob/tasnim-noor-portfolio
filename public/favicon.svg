<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="tn-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fb7185" />
      <stop offset="50%" stop-color="#f43f5e" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18181b" />
      <stop offset="100%" stop-color="#09090b" />
    </linearGradient>
  </defs>

  <!-- Rounded Squircle Background -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#bg-grad)" stroke="url(#tn-grad)" stroke-width="2.5" />

  <!-- Monogram TN with modern typography -->
  <text x="32" y="37" 
        font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" 
        font-size="25" 
        font-weight="900" 
        letter-spacing="0.5" 
        fill="url(#tn-grad)" 
        text-anchor="middle" 
        dominant-baseline="central">
    TN
  </text>

  <!-- Creative Sparkle Accent Dot -->
  <circle cx="48" cy="16" r="3" fill="#fbbf24" />
</svg>

